# YAML EDITING RULES
# - Use spaces for indentation, never tabs. Keep the existing indentation.
# - Keep field names such as "title", "text" unchanged.
# - Short text is quoted so punctuation is read literally.
# - For paragraphs, keep ">-" on the field line and indent the paragraph below.
# - A colon followed by a space and a # preceded by a space have special meaning
#   in unquoted text. Quoted text and ">-" paragraphs avoid those problems.
# - Leave true and false unquoted when used; they are settings, not text.
# - Each "-" begins another item in a list.
# - Keep each care card inside the "cards" list for its care group.
# - For a care card image, replace null with a quoted path such as
#   "cards/meals.jpg". If image is null, the card displays its emoji instead.
# - Put care card image files in public/cards/.
# - Image files stay in public/gallery/. The "file" value is the path to an
#   image, and "description" is the accessible description of that image.
