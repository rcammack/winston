# HERO SECTION — displayed with the header "Professional good boy"
hero:
  greeting: "Hi, I’m"
  name: "Winston."
  intro: >-
    I'm a unique mix of angel and menace looking for a
    kind sitter who understands dog behavior and will keep my tail wagging. I will happily accepts pets from anyone, including strangers, and I'm smart so I know a lot of tricks. My owner is a crazy dog mom who made this website for me.
