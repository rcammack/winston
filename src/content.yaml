# HERO SECTION — displayed with the red header "Professional good boy"
hero:
  greeting: "Hi, I’m"
  name: "Winston."
  intro: >-
    My owner is a crazy dog mom who made this website for me. Looking for a
    kind sitter who will keep my tail wagging.
  care_button: "Read my care guide"
  contact_button: "Contact my humans"
  image: "winston.png"
  image_description: "Winston, a happy dog"

# ABOUT SECTION — displayed with the red header "A little about me"
about:
  heading: "Easygoing, curious, and always up for company."
  description: >-
    Winston is a friendly, medium-energy mix of Miniature Poodle, Pomeranian,
    Papillon, and Bichon Frise. He loves fetch and happily accepts pets from
    anyone, including strangers. His excitement can come out as barking or
    overly enthusiastic behavior, so calm, attentive handling helps him feel
    secure.
  traits:
    - "Loves fetch"
    - "House trained"
    - "Knows drop it & leave it"
    - "Crate trained"
    - "Neutered"
    - "Microchipped"

# CARE GUIDE SECTION — displayed with the red header "The important stuff"
care:
  heading: "Winston’s care guide"
  description: "Everything you need for a happy, low-stress stay."
  cards:
    - image: null
      emoji: "🥣"
      title: "Meals"
      text: >-
        Feed 1/4 cup of kibble twice a day—once in the morning and once in the
        evening.

    - image: null
      emoji: "🚫"
      title: "Elimination diet"
      text: >-
        No chicken, beef, lamb, dairy, or wheat, including in treats. He is on
        an elimination diet because he has been itchy and licking his paws.

    - image: null
      emoji: "🦮"
      title: "Potty breaks"
      text: >-
        Take him out every 4–5 hours. He does not whine or otherwise signal
        when he needs to pee, so do not wait for him to ask.

    - image: null
      emoji: "🏠"
      title: "House training"
      text: >-
        He is house trained, but fuzzy carpet may confuse him. If another dog
        has peed indoors, he may try to mark that spot.

    - image: null
      emoji: "💤"
      title: "Crate routine"
      text: >-
        He sleeps in his crate overnight. He also takes a 2–3 hour crate nap
        around 5–7 PM, or after his evening walk.

    - image: null
      emoji: "🚪"
      title: "Separation anxiety"
      text: >-
        He has separation anxiety. His daily evening crate nap is his trained
        window for being home alone while you run errands, eat out, or work out.

    - image: null
      emoji: "🐕"
      title: "Other dogs"
      text: >-
        He is friendly with most dogs and may bark from excitement, but do not
        let him play with them. Avoid on-leash greetings because the hands-free
        leash tangles easily.

    - image: null
      emoji: "🦺"
      title: "Harness only"
      text: >-
        Never use a collar. His breed mix is prone to collapsed trachea, so
        always attach his leash to a harness.

    - image: null
      emoji: "👟"
      title: "Overexcitement on walks"
      text: >-
        When he gets too excited or exhausted during a walk, he may attack
        shoes, slippers, or feet—especially while crossing the street. Watch
        for overstimulation and keep crossings controlled.

    - image: null
      emoji: "👧"
      title: "Children & cats"
      text: >-
        He loves children and regularly sees a 3-year-old, but can get too
        excited around them. His behavior with cats is unknown because he has
        never been introduced to one.

    - image: null
      emoji: "🧻"
      title: "Resource guarding"
      text: >-
        He may guard stolen items such as used tissues. Read his body language
        and do not take things away unless it is an emergency. Prevent access
        and use “drop it” or “leave it.”

    - image: null
      emoji: "⚠️"
      title: "Pain response"
      text: >-
        His default response to pain, including being accidentally stepped on,
        is to growl rather than whine. Give him space and pay attention to his
        body language.

    - image: null
      emoji: "🚗"
      title: "Car rides"
      text: >-
        Always put him in the back seat and secure him with his seat belt.

# COMMANDS SECTION — displayed with the red header "Commands Winston knows"
commands:
  heading: "Communicating with Winston"
  description: >-
    Here are Winston’s most useful commands, including the exact phrase and
    hand signal to use. Hover or click a command to see more details.
  detail_prefix: "How to use"
  useful:
    - name: "Sit"
      details: >-
        Use when Winston needs to pause and focus before the next instruction.
    - name: "Stay"
      details: >-
        Use when Winston needs to remain in place until he is released.
    - name: "Down"
      details: "Use when you want Winston to lie down and settle."
    - name: "Leave it"
      details: >-
        Use before he picks up or approaches something he should not have. This
        is preferable to taking an item away.
    - name: "Drop it"
      details: >-
        Use after he has something in his mouth. Give the cue instead of
        reaching for the item; only take it directly in an emergency.
  tricks:
    - name: "Shake"
      details: "A just-for-fun paw shake."
    - name: "Spin"
      details: "A just-for-fun turn in a circle."
  other_words: "Okay, walk, food."

